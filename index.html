<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麦乐 · 扫码支付</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 36px 28px;
    width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .shop { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 3px solid #eee; border-top-color: #07c160; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #888; font-size: 14px; margin-bottom: 20px; }
  .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .btn {
    display: block; padding: 14px; border-radius: 10px;
    font-size: 16px; font-weight: 600; text-decoration: none; color: #fff;
  }
  .btn.wx { background: #07c160; }
  .btn.ali { background: #1677ff; }
  .tip { margin-top: 20px; font-size: 12px; color: #aaa; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="shop">麦乐</div>
  <div class="sub">扫码支付</div>
  <div class="spinner"></div>
  <div class="hint" id="hint">正在跳转到支付…</div>
  <div class="btns">
    <a class="btn wx" id="wxBtn" href="https://payapp.weixin.qq.com/qrpay/order/home2?key=idc_CHNDVI_Va49XDNZIWNuwr0dzEw4CA--">微信支付</a>
    <a class="btn ali" id="aliBtn" href="https://qr.alipay.com/2m616195w3vpoow2hqpvtf8">支付宝支付</a>
  </div>
  <div class="tip">如果没有自动跳转<br>请点击上方对应按钮完成支付</div>
</div>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var wxUrl = "https://payapp.weixin.qq.com/qrpay/order/home2?key=idc_CHNDVI_Va49XDNZIWNuwr0dzEw4CA--";
  var aliUrl = "https://qr.alipay.com/2m616195w3vpoow2hqpvtf8";
  var hint = document.getElementById("hint");
  if (/MicroMessenger/i.test(ua)) {
    location.replace(wxUrl);
  } else if (/AlipayClient/i.test(ua)) {
    location.replace(aliUrl);
  } else {
    hint.textContent = "请选择支付方式";
    document.querySelector(".spinner").style.display = "none";
  }
})();
</script>
</body>
</html>
